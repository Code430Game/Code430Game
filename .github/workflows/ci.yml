name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  UV_VERSION: "0.12.19"

jobs:
  tools:
    name: Python tools (pytest, ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q

  packs:
    name: Pack manifests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: uv sync --frozen
      - run: uv run python -m pack_tools ../packs

  gdunit:
    name: gdUnit4 (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Godot version
        id: godot
        run: echo "version=$(cat .godot-version)" >> "$GITHUB_OUTPUT"
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ steps.godot.outputs.version }}-linux
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${{ steps.godot.outputs.version }}"
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
      - name: Import project
        run: ~/godot/godot --headless --path game --import --quit
      - name: Run tests
        run: |
          ~/godot/godot --headless --path game -s -d --remote-debug tcp://127.0.0.1:0 \
            res://addons/gdUnit4/bin/GdUnitCmdTool.gd --ignoreHeadlessMode -c -a res://tests
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit4-report
          path: game/reports
          if-no-files-found: ignore

  export-linux:
    name: Linux export
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [tools, packs, gdunit]
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Godot version
        id: godot
        run: |
          V="$(cat .godot-version)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "templates_dir=${V/-stable/.stable}" >> "$GITHUB_OUTPUT"
      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ steps.godot.outputs.version }}-linux-templates
      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${{ steps.godot.outputs.version }}"
          T="${{ steps.godot.outputs.templates_dir }}"
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/"$T"
      - name: Import project
        run: ~/godot/godot --headless --path game --import --quit
      - name: Export
        run: |
          mkdir -p build/linux
          ~/godot/godot --headless --path game --export-release "Linux" ../build/linux/code430.x86_64
          ls -la build/linux
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: code430-linux-${{ github.sha }}
          path: build/linux
          if-no-files-found: error
