name: CI

# Runs on GitHub's runners, for pushes, pull requests (forks included) and by hand. The
# maintainer's Mac ran CI until 2026-10-23 and is no longer a registered runner, so no job can
# land on it. The one job runs scripts/ci-local.sh, the same check as by hand.
# It still skips what a change can't affect:
# - docs, OpenSpec and Markdown-only changes don't build or test the game (OpenSpec has its own
#   quick check in openspec.yml);
# - a newer push to a pull request cancels the older run;
# - the Linux export runs only by hand.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "openspec/**"
      - "**/*.md"
      - "LICENSE*"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "openspec/**"
      - "**/*.md"
      - "LICENSE*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.19"

jobs:
  local-ci:
    name: Local CI (pytest, ruff, packs, OpenSpec, gdUnit4)
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # GitHub's runners start empty: uv, the pinned Godot and OpenSpec.
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Godot and OpenSpec
        run: |
          set -euo pipefail
          V="$(cat .godot-version)"
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          echo "GODOT_BIN=$HOME/godot/godot" >> "$GITHUB_ENV"
          npm install -g "@fission-ai/openspec@$(cat .openspec-version)"
      - name: scripts/ci-local.sh
        run: scripts/ci-local.sh

  export-linux:
    name: Linux export
    timeout-minutes: 30
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'  # by hand only
    needs: [local-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Godot and its export templates
        run: |
          set -euo pipefail
          V="$(cat .godot-version)"
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          T=~/.local/share/godot/export_templates/"${V/-/.}"
          mkdir -p "$T"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$T"/
          echo "GODOT_BIN=$HOME/godot/godot" >> "$GITHUB_ENV"
      - run: scripts/package.sh linux
      - uses: actions/upload-artifact@v4
        with:
          name: code430-linux-${{ github.sha }}
          path: build/linux
          if-no-files-found: error
          retention-days: 7
