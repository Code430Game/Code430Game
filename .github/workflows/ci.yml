name: CI

# Runs on the maintainer's Mac (a self-hosted runner labelled `code430-mac`, set up 2026-10-09),
# not on GitHub's runners: the private repo's 2,000 free minutes ran out. Jobs wait in the queue
# while that Mac is off. The one job runs scripts/ci-local.sh, the same check as by hand.
# Before the repo goes public, PRs from forks must not run here (they would run a stranger's
# code on that Mac): move pull_request jobs back to GitHub's runners then.
# It still skips what a change can't affect:
# - docs, OpenSpec and Markdown-only changes don't build or test the game (OpenSpec has its own
#   quick check in openspec.yml);
# - a newer push to a pull request cancels the older run;
# - the Linux export runs only by hand.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "openspec/**"
      - "**/*.md"
      - "LICENSE*"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "openspec/**"
      - "**/*.md"
      - "LICENSE*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.19"

jobs:
  local-ci:
    name: Local CI (pytest, ruff, packs, OpenSpec, gdUnit4)
    timeout-minutes: 30  # a hang must not tie up the Mac
    runs-on: [self-hosted, code430-mac]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: scripts/ci-local.sh
        run: scripts/ci-local.sh  # GODOT_BIN comes from the runner's .env

  export-linux:
    name: Linux export
    timeout-minutes: 30
    runs-on: [self-hosted, code430-mac]
    if: github.event_name == 'workflow_dispatch'  # by hand only
    needs: [local-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: GODOT_BIN="$GODOT_BIN" scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: code430-linux-${{ github.sha }}
          path: build/linux
          if-no-files-found: error
          retention-days: 7
