[project]
name = "code430-tools"
version = "0.1.0"
description = "Offline tools for Code 430: pack validation, OSM import."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "mapbox-earcut>=2.1.0",
    "networkx>=3.6.1",
    "pyproj>=3.7.2",
    "rasterio>=1.4.4",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pack_tools"]
